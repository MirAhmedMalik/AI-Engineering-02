<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="System architecture">
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #14202a; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 12.5px; }
    .m { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; }
    .t { font-size: 19px; font-weight: 700; }
    .zone { fill: none; stroke: #9aa8a2; stroke-width: 1.4; stroke-dasharray: 7 5; }
    .box { fill: #ffffff; stroke: #14202a; stroke-width: 1.6; }
    .fe { fill: #fff3d6; stroke: #8a5a00; stroke-width: 1.6; }
    .be { fill: #e8f1ff; stroke: #1a3f94; stroke-width: 1.6; }
    .ext { fill: #e2f3e9; stroke: #14733f; stroke-width: 1.6; }
    .key { fill: #fbe6e4; stroke: #b3261e; stroke-width: 1.6; }
    .arrow { stroke: #14202a; stroke-width: 1.7; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14202a"/></marker>
  </defs>
  <rect width="960" height="470" fill="#f7f9f8"/>
  <text class="t" x="24" y="34">How the parts fit together</text>

  <rect class="zone" x="16" y="52" width="196" height="404" rx="12"/>
  <text class="s" x="28" y="72">Browser (no secrets)</text>
  <rect class="fe" x="32" y="90" width="164" height="118" rx="8"/>
  <text class="h" x="44" y="114">Game UI</text>
  <text class="s" x="44" y="135">scrambled cube</text>
  <text class="s" x="44" y="152">Run benchmark button</text>
  <text class="s" x="44" y="169">current move, history</text>
  <text class="s" x="44" y="186">result, ranking</text>
  <rect class="fe" x="32" y="232" width="164" height="96" rx="8"/>
  <text class="h" x="44" y="256">Statistics slide</text>
  <text class="s" x="44" y="277">success, latency, time,</text>
  <text class="s" x="44" y="294">moves, optimality gap</text>
  <text class="s" x="44" y="316">name + roll no. bar</text>

  <rect class="zone" x="240" y="52" width="470" height="404" rx="12"/>
  <text class="s" x="252" y="72">Python backend (FastAPI), holds the API key</text>
  <rect class="be" x="256" y="90" width="206" height="70" rx="8"/>
  <text class="h" x="268" y="114">main.py</text>
  <text class="s" x="268" y="134">REST + live events (SSE)</text>
  <text class="s" x="268" y="150">run, cancel, saved runs</text>
  <rect class="be" x="488" y="90" width="206" height="70" rx="8"/>
  <text class="h" x="500" y="114">suite.py / race.py</text>
  <text class="s" x="500" y="134">same puzzle for all models</text>
  <text class="s" x="500" y="150">trial = one model, one puzzle</text>
  <rect class="be" x="256" y="184" width="438" height="110" rx="8"/>
  <text class="h" x="268" y="208">agents/ + gateway  (one retry policy)</text>
  <text class="s" x="268" y="230">contract.py: the same state, moves and wording for all</text>
  <text class="m" x="268" y="250">DecisionsAgent: Jev, Luna, Clef (also local Clef)</text>
  <text class="m" x="268" y="268">ChatAgent: Claude Haiku  |  OllamaAgent: Qwen, ...</text>
  <text class="s" x="268" y="285">gateway: cache, then count + log, then request (limits 5/20/65)</text>
  <rect class="be" x="256" y="318" width="206" height="116" rx="8"/>
  <text class="h" x="268" y="342">cube/</text>
  <text class="s" x="268" y="362">engine: 54 facelets, 18 moves</text>
  <text class="s" x="268" y="379">puzzles: seeded scrambles</text>
  <text class="s" x="268" y="396">solver: exact BFS optimum</text>
  <text class="s" x="268" y="418">(meet in the middle)</text>
  <rect class="be" x="488" y="318" width="206" height="116" rx="8"/>
  <text class="h" x="500" y="342">stats.py / report.py</text>
  <text class="s" x="500" y="362">latency, success, gap</text>
  <text class="s" x="500" y="379">results/runs/*.json, csv</text>
  <text class="s" x="500" y="396">SVG charts and README</text>
  <text class="s" x="500" y="418">results section</text>

  <rect class="key" x="740" y="60" width="204" height="62" rx="8"/>
  <text class="h" x="752" y="84">.env (never committed)</text>
  <text class="m" x="752" y="104">OPENROUTER_API_KEY</text>

  <rect class="ext" x="740" y="190" width="204" height="104" rx="8"/>
  <text class="h" x="752" y="214">OpenRouter</text>
  <text class="m" x="752" y="236">/api/alpha/decisions</text>
  <text class="s" x="752" y="253">Jev, Luna, Clef</text>
  <text class="m" x="752" y="274">/api/v1/chat/completions</text>
  <text class="s" x="752" y="289">Claude Haiku 5.5</text>

  <path class="arrow" d="M196,138 L254,118"/>
  <path class="arrow" d="M254,134 L196,154"/>
  <text class="s" x="206" y="176">HTTP + SSE</text>
  <path class="arrow" d="M462,125 L486,125"/>
  <path class="arrow" d="M591,160 L591,182"/>
  <path class="arrow" d="M696,240 L738,240"/>
  <rect class="ext" x="740" y="392" width="204" height="56" rx="8"/>
  <text class="h" x="752" y="414">Ollama (local, free)</text>
  <text class="s" x="752" y="432">/v1/systemone, /api/chat</text>
  <path class="arrow" d="M696,270 L718,270 L718,420 L738,420"/>
  <path class="arrow" d="M740,100 L696,100"/>
  <path class="arrow" d="M359,296 L359,316"/>
  <path class="arrow" d="M591,296 L591,316"/>
      <text class="s" x="752" y="320">The key goes from .env to the</text>
  <text class="s" x="752" y="337">backend only. The browser</text>
  <text class="s" x="752" y="354">talks to the backend, never</text>
  <text class="s" x="752" y="371">to OpenRouter.</text>
</svg>
